spring.application.name=shop_backend

spring.datasource.url=jdbc:postgresql://localhost:5432/shopdb
spring.datasource.username=shop
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true


paypal.env=sandbox
paypal.client-id=${PAYPAL_CLIENT_ID:}
paypal.client-secret=${PAYPAL_CLIENT_SECRET:}
paypal.app-base-url=${PAYPAL_APP_BASE_URL:http://localhost:8080}
paypal.ui-base-url=${PAYPAL_UI_BASE_URL:http://127.0.0.1:5173}
